name: Build Mantle

on:
  push:
    branches: ["1.21.X"]
  pull_request:
    branches: ["1.21.X"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge target
        run: ./gradlew :1.21.1-neoforge:build --no-daemon
