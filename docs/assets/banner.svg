<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Mantle — shared library for Slime Knights mods, Minecraft 1.21.1 on NeoForge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mSurf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171E24"/>
      <stop offset="1" stop-color="#101519"/>
    </linearGradient>
    <linearGradient id="mAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35C39A"/>
      <stop offset="1" stop-color="#4FA8D8"/>
    </linearGradient>
    <clipPath id="mClip"><rect x="0" y="0" width="1200" height="260" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="16" fill="url(#mSurf)"/>

  <!-- geological strata motif -->
  <g clip-path="url(#mClip)" opacity="0.9">
    <path d="M700 260 C 820 170, 980 205, 1200 120 L1200 260 Z" fill="#1B242B"/>
    <path d="M760 260 C 900 200, 1030 232, 1200 168 L1200 260 Z" fill="#202C34"/>
    <path d="M840 260 C 960 224, 1080 250, 1200 210 L1200 260 Z" fill="#26343D"/>
    <g stroke="#35C39A" stroke-width="2" fill="none" opacity="0.45">
      <path d="M700 260 C 820 170, 980 205, 1200 120"/>
      <path d="M760 260 C 900 200, 1030 232, 1200 168"/>
    </g>
  </g>

  <!-- layered-plates mark -->
  <g transform="translate(64,96)">
    <path d="M34 0 L68 19 L34 38 L0 19 Z" fill="#4FA8D8"/>
    <path d="M34 26 L68 45 L34 64 L0 45 Z" fill="#35C39A" opacity="0.92"/>
    <path d="M34 52 L68 71 L34 90 L0 71 Z" fill="#2B7F9E" opacity="0.75"/>
  </g>

  <text x="168" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="7" fill="#EEF3F7">MANTLE</text>
  <text x="171" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" fill="#9FB0BD">Shared library for Slime Knights mods</text>

  <rect x="171" y="170" width="132" height="3" rx="1.5" fill="url(#mAccent)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <g transform="translate(171,198)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#18272B" stroke="#35C39A" stroke-opacity="0.45"/>
      <circle cx="19" cy="15" r="4.5" fill="#35C39A"/>
      <text x="32" y="20" fill="#CFE3E0">build passing</text>
    </g>
    <g transform="translate(333,198)">
      <rect x="0" y="0" width="136" height="30" rx="15" fill="#18272B" stroke="#35C39A" stroke-opacity="0.45"/>
      <circle cx="19" cy="15" r="4.5" fill="#35C39A"/>
      <text x="32" y="20" fill="#CFE3E0">mod loads</text>
    </g>
    <g transform="translate(481,198)">
      <rect x="0" y="0" width="172" height="30" rx="15" fill="#18272B" stroke="#35C39A" stroke-opacity="0.45"/>
      <circle cx="19" cy="15" r="4.5" fill="#35C39A"/>
      <text x="32" y="20" fill="#CFE3E0">0 compile errors</text>
    </g>
  </g>

  <text x="171" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="13.5" fill="#6B7C89">Minecraft 1.21.1  &#183;  NeoForge 21.1.77  &#183;  Java 21</text>
</svg>
