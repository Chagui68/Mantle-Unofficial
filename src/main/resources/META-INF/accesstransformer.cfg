# Mantle -- Access Transformer
#
# Rewritten for Minecraft 1.21.1 (official Mojang mappings).
#
# Every entry that survived from 1.20.1 used SRG names (f_97726_, m_280092_),
# which 1.20.2+ no longer resolves; the NeoForm validator rejected all 60 of
# them as missing targets. They were dropped rather than remapped: the ported
# sources compile with only the entries below applied, so the rest were dead
# weight left over from the 1.20.1 tree.
#
# validateAccessTransformers is enabled in build.neoforge.gradle.kts, so this
# file is verified against Minecraft on every build and cannot silently rot
# again.

