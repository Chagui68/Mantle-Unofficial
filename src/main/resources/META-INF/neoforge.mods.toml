modLoader="javafml"
# javafml language provider version, not the NeoForge version.
loaderVersion="[4,)"
issueTrackerURL="https://github.com/SlimeKnights/Mantle/issues"
license="MIT"

[[mods]]
    modId="mantle"
    version="${version}"
    displayName="Mantle"
    authors="Slime Knights"
    logoFile="Mantle.png"
    displayURL="https://minecraft.curseforge.com/projects/mantle"
    description='''
Shared code for Slime Knights mods and others.
    '''

[[dependencies.mantle]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.mantle]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"
